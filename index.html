<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WIKKI.OS</title>
<meta name="theme-color" content="#07070D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;
  --bg:#07070D;--bg2:#050509;--s1:#101017;--s2:#15151D;--s3:#1C1C26;--line:rgba(242,237,226,.08);--line2:rgba(242,237,226,.14);
  --tx:#F2EDE2;--tx2:rgba(242,237,226,.62);--tx3:rgba(242,237,226,.38);
  --v:#9B6FE8;--vb:#C4A4FF;--vd:#5B2FBE;--vm:#7C4FD4;--c:#00C4D4;--cb:#5EE0EE;
  --mono:'DM Mono',ui-monospace,monospace;--r:20px;--r2:14px;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:inherit}
a{color:var(--vb)}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:var(--tx3)}
.h1{font-weight:900;text-transform:uppercase;letter-spacing:-1.5px;line-height:.95;font-size:clamp(30px,5vw,46px);
  background:linear-gradient(135deg,#F2EDE2 0%,#C4A4FF 60%,#9B6FE8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.glow{position:fixed;inset:-20vh -20vw auto auto;width:70vw;height:70vh;background:radial-gradient(closest-side,rgba(124,79,212,.16),transparent);pointer-events:none;z-index:0}

/* ── каркас ── */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh;position:relative;z-index:1}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 12px 18px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;background:rgba(5,5,9,.72);backdrop-filter:blur(12px);scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px 18px}
.brand img{width:36px;height:36px;border-radius:11px}
.brand b{font-weight:900;letter-spacing:.06em;font-size:15px}
.brand small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--tx3);text-transform:uppercase}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--tx2);font-weight:500;width:100%;font-size:14px;min-height:36px;transition:background .12s;cursor:pointer}
.nav:hover{background:var(--s1);color:var(--tx)}
.nav.on{background:linear-gradient(135deg,rgba(124,79,212,.26),rgba(91,47,190,.1));color:var(--tx);box-shadow:inset 0 0 0 1px rgba(196,164,255,.18)}
.nav .ic{width:20px;text-align:center;flex:none;font-size:15px}
.nav .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .tw{width:18px;height:18px;display:grid;place-items:center;color:var(--tx3);border-radius:5px;flex:none;font-size:10px}
.nav .tw:hover{background:var(--s3)}
.nav .add{opacity:0;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--tx3)}
.nav:hover .add{opacity:1}.nav .add:hover{background:var(--s3);color:var(--tx)}
.grp{display:flex;align-items:center;justify-content:space-between;padding:16px 10px 6px}
.grp button{color:var(--tx3);font-size:16px;width:22px;height:22px;border-radius:6px;text-align:center}
.grp button:hover{background:var(--s1);color:var(--tx)}
.side .foot{margin-top:auto;padding-top:14px;display:flex;flex-direction:column;gap:2px}
.main{padding:30px clamp(16px,4vw,52px) 120px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.tabbar,.burger{display:none}
.scrim{display:none}

/* ── элементы ── */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;background:var(--s2);box-shadow:inset 0 0 0 1px var(--line2);transition:.15s;white-space:nowrap}
.btn:hover{background:var(--s3)}
.btn.pri{background:linear-gradient(135deg,#9B6FE8,#5B2FBE);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.btn.ghost{background:none;box-shadow:none;color:var(--tx2)}
.btn.ghost:hover{background:var(--s1);color:var(--tx)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:500;color:var(--tx2);background:var(--s1);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.chip.on{color:var(--tx);background:rgba(124,79,212,.22);box-shadow:inset 0 0 0 1px rgba(196,164,255,.35)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.tile{background:linear-gradient(180deg,rgba(21,21,29,.92),rgba(16,16,23,.92));border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--line);padding:20px;position:relative;overflow:hidden}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.gA{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.sec{margin-top:30px}
.sec>.mono{display:block;margin-bottom:12px}
.empty{color:var(--tx3);font-size:14px;padding:16px;text-align:center;border:1px dashed var(--line2);border-radius:var(--r2)}
.bar{height:6px;border-radius:9px;background:rgba(242,237,226,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#5B2FBE,#C4A4FF)}
.opt{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:7px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;background:rgba(242,237,226,.07);color:var(--tx)}
.opt i{width:7px;height:7px;border-radius:50%;flex:none}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:7px;background:rgba(242,237,226,.06);color:var(--tx2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-block}
.tag.hot{background:var(--vb);color:#120A24;font-weight:500}
.tag.soon{background:rgba(196,164,255,.16);color:var(--vb)}
.rel{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:2px 8px;border-radius:7px;background:rgba(242,237,226,.05);box-shadow:inset 0 -1px 0 rgba(196,164,255,.25);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.who{width:24px;height:24px;border-radius:8px;display:inline-grid;place-items:center;font-size:11px;font-weight:700;background:var(--s3);color:var(--tx2);flex:none}
.who.claude{background:rgba(0,196,212,.16);color:var(--cb)}
.who.assistant{background:rgba(196,164,255,.16);color:var(--vb)}
.check{width:24px;height:24px;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--line2);flex:none;display:grid;place-items:center;transition:.15s}
.check:hover{box-shadow:inset 0 0 0 1.5px var(--vb)}
.check.on{background:var(--v);box-shadow:none}
.check svg{width:14px;height:14px;opacity:0}.check.on svg{opacity:1}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-height:52px}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0;font-weight:500}
.row .t small{display:block;color:var(--tx3);font-size:12.5px;font-weight:400;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase}
.live i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.live.off i{background:var(--tx3);box-shadow:none}
.in{width:100%;padding:12px 14px;border-radius:12px;background:var(--bg2);border:0;box-shadow:inset 0 0 0 1px var(--line2);outline:none}
.in:focus{box-shadow:inset 0 0 0 1px var(--v)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}

/* сегодня */
.focus{display:flex;flex-direction:column;gap:14px;min-height:170px;cursor:pointer}
.focus .n{font-weight:900;font-size:44px;line-height:.8;letter-spacing:-2px;background:linear-gradient(180deg,#C4A4FF,#5B2FBE);-webkit-background-clip:text;background-clip:text;color:transparent}
.focus .t{font-size:19px;font-weight:700;line-height:1.25}
.focus .meta{margin-top:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.focus.slot{display:grid;place-items:center;text-align:center;color:var(--tx3);background:rgba(16,16,23,.5);border:1px dashed var(--line2);box-shadow:none}
.focus.done .t{text-decoration:line-through;color:var(--tx3)}
.stat{display:flex;flex-direction:column;gap:6px}
.stat b{font-size:32px;font-weight:900;letter-spacing:-1px;line-height:1}
.area{cursor:pointer;display:flex;flex-direction:column;gap:12px}
.area .nm{display:flex;align-items:center;gap:10px;font-weight:900;text-transform:uppercase;font-size:15px}
.area .fx{color:var(--tx2);font-size:13.5px;min-height:38px}
.area .nums{display:flex;gap:16px}
.area .nums div{font-size:12px;color:var(--tx3)}
.area .nums b{display:block;font-size:20px;color:var(--tx);font-weight:700}

/* база */
.dbhead{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.dbhead .ico{font-size:34px;line-height:1}
.vtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 14px;overflow-x:auto;scrollbar-width:none}
.vtabs::-webkit-scrollbar{display:none}
.vtabs button{padding:10px 12px;font-size:13.5px;color:var(--tx3);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.vtabs button.on{color:var(--tx);border-bottom-color:var(--v)}
.vtabs button:hover{color:var(--tx)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:160px;padding:9px 13px;border-radius:11px;background:var(--s1);border:0;box-shadow:inset 0 0 0 1px var(--line);outline:none;font-size:14px}
.search:focus{box-shadow:inset 0 0 0 1px var(--v)}
.fpill{font-size:12.5px;padding:6px 10px;border-radius:9px;background:rgba(124,79,212,.16);color:var(--vb);display:inline-flex;gap:6px;align-items:center}
.tbl-wrap{overflow-x:auto;border-radius:var(--r2);box-shadow:inset 0 0 0 1px var(--line);background:rgba(16,16,23,.55)}
table.tbl{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.tbl th{text-align:left;font-weight:500;color:var(--tx3);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;background:#111118}
.tbl th:hover{color:var(--tx)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;max-width:280px;cursor:pointer}
.tbl tr:hover td{background:rgba(242,237,226,.025)}
.tbl td.ttl{font-weight:500;min-width:220px}
.tbl td .cell{display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-height:22px}
.tbl .addrow td{color:var(--tx3);font-size:13px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory}
.col{background:rgba(16,16,23,.55);border-radius:var(--r);padding:10px;min-height:260px;scroll-snap-align:start;box-shadow:inset 0 0 0 1px var(--line)}
.col.over{box-shadow:inset 0 0 0 1.5px var(--v);background:rgba(124,79,212,.08)}
.col h4{display:flex;gap:8px;align-items:center;padding:4px 6px 10px;font-size:13px;font-weight:500}
.col h4 em{font-style:normal;font-size:12px;color:var(--tx3);margin-left:auto}
.card{background:var(--s2);border-radius:13px;padding:12px;margin-bottom:8px;box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;display:flex;flex-direction:column;gap:8px}
.card:hover{box-shadow:inset 0 0 0 1px var(--line2)}
.card.drag{opacity:.4}
.card .t{font-weight:500;font-size:14px;line-height:1.35}
.card .m{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.addc{width:100%;padding:9px;border-radius:11px;color:var(--tx3);font-size:13px}
.addc:hover{color:var(--tx);background:var(--s1)}
.gal{cursor:pointer;display:flex;flex-direction:column;gap:12px;min-height:170px}
.gal .ico{font-size:26px;line-height:1}
.gal .t{font-size:17px;font-weight:700;line-height:1.25}
.gal .m{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big b{font-size:34px;font-weight:900;letter-spacing:-1.5px;line-height:1}
.big span{color:var(--tx3)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--tx3);text-align:center;padding:6px 0}
.cal .d{min-height:104px;background:rgba(16,16,23,.6);border-radius:12px;padding:7px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:4px;min-width:0;cursor:pointer}
.cal .d.out{opacity:.35}.cal .d.today{box-shadow:inset 0 0 0 1.5px var(--v)}
.cal .d b{font-size:12px;color:var(--tx2);font-weight:500}
.cal .ev{font-size:11.5px;padding:3px 6px;border-radius:6px;background:var(--s3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid var(--v)}

/* страница */
.crumbs{display:flex;align-items:center;gap:6px;color:var(--tx3);font-size:13px;flex-wrap:wrap;min-width:0}
.crumbs a{color:var(--tx2);text-decoration:none;cursor:pointer}.crumbs a:hover{color:var(--tx)}
.pg{max-width:860px;margin:0 auto}
.pg .ico{font-size:52px;line-height:1;cursor:pointer;display:inline-block;margin-bottom:10px;border-radius:12px;padding:2px}
.pg .ico:hover{background:var(--s1)}
.pg .addico{color:var(--tx3);font-size:13px;margin-bottom:8px}
.pg .ttl{font-size:clamp(28px,4.4vw,40px);font-weight:900;letter-spacing:-1px;line-height:1.1;outline:none;word-break:break-word;min-height:1.1em}
.pg .ttl:empty:before{content:'Без названия';color:var(--tx3)}
.pgbar{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex:none}
.tpl-banner{padding:10px 14px;border-radius:12px;background:rgba(0,196,212,.1);color:var(--cb);font-size:13.5px;margin-bottom:18px;box-shadow:inset 0 0 0 1px rgba(0,196,212,.2)}
.props{margin:22px 0 10px;display:flex;flex-direction:column;gap:2px}
.prop{display:grid;grid-template-columns:170px 1fr;gap:10px;align-items:center;min-height:38px}
.prop .pn{color:var(--tx3);font-size:13.5px;display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prop .pn:hover{background:var(--s1);color:var(--tx2)}
.prop .pv{min-width:0;padding:4px 8px;border-radius:8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:34px}
.prop .pv.click{cursor:pointer}
.prop .pv.click:hover{background:var(--s1)}
.prop .pv.nil:after{content:'Пусто';color:var(--tx3);font-size:13.5px}
.prop input.pin{flex:1;min-width:0;background:transparent;border:0;outline:none;padding:4px 0;font-size:14.5px}
.prop input.pin::placeholder{color:var(--tx3)}
.addprop{color:var(--tx3);font-size:13.5px;padding:6px 8px;border-radius:8px;align-self:flex-start}
.addprop:hover{background:var(--s1);color:var(--tx2)}
.hr{height:1px;background:var(--line);margin:18px 0}
.backl{margin-top:34px}

/* редактор блоков */
.editor{padding:6px 0 60px;position:relative}
.blk{position:relative;display:flex;gap:8px;align-items:flex-start;padding:2px 0}
.blk .ce{flex:1;min-width:0;outline:none;white-space:pre-wrap;word-break:break-word;padding:3px 2px;line-height:1.6;font-size:16px}
.blk .ce:empty:before{content:attr(data-ph);color:transparent}
.blk .ce:focus:empty:before{color:var(--tx3)}
.blk.h1 .ce{font-size:28px;font-weight:900;letter-spacing:-.5px;line-height:1.2;padding-top:18px}
.blk.h2 .ce{font-size:21px;font-weight:700;line-height:1.3;padding-top:14px}
.blk.h3 .ce{font-size:17px;font-weight:700;padding-top:10px}
.blk .mk{width:22px;flex:none;text-align:center;color:var(--tx2);padding-top:4px;font-size:16px;user-select:none}
.blk.bullet .mk:before{content:'•';font-size:20px;line-height:1}
.blk.todo .mk{padding-top:5px}
.blk.todo.done .ce{text-decoration:line-through;color:var(--tx3)}
.blk.quote .ce{border-left:3px solid var(--v);padding-left:14px;color:var(--tx2);font-size:17px}
.blk.callout{background:rgba(124,79,212,.12);border-radius:12px;padding:12px 14px;margin:6px 0;box-shadow:inset 0 0 0 1px rgba(196,164,255,.15)}
.blk.callout .mk{padding-top:3px}
.blk.code .ce{font-family:var(--mono);font-size:13.5px;background:var(--s1);border-radius:10px;padding:12px 14px;box-shadow:inset 0 0 0 1px var(--line)}
.blk.divider{padding:12px 0}.blk.divider hr{border:0;height:1px;background:var(--line2);flex:1}
.blk.page .pl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;flex:1;font-weight:500;text-decoration:underline;text-decoration-color:rgba(196,164,255,.35);text-underline-offset:4px}
.blk.page .pl:hover{background:var(--s1)}
.blk .hdl{position:absolute;left:-30px;top:5px;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--tx3);opacity:0;font-size:12px;letter-spacing:-2px}
.blk:hover .hdl{opacity:1}.blk .hdl:hover{background:var(--s2);color:var(--tx)}
.slash{position:absolute;z-index:40;width:280px;max-height:340px;overflow-y:auto;background:#17171F;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 0 0 1px var(--line2);padding:6px}
.slash button{display:flex;gap:12px;align-items:center;width:100%;padding:8px 10px;border-radius:9px;font-size:14px}
.slash button.on,.slash button:hover{background:var(--s3)}
.slash .si{width:30px;height:30px;border-radius:8px;background:var(--s2);display:grid;place-items:center;font-size:14px;flex:none;box-shadow:inset 0 0 0 1px var(--line)}
.slash small{display:block;color:var(--tx3);font-size:12px}

/* окна */
.modal{position:fixed;inset:0;background:rgba(3,3,6,.72);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#17171F,#101017);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 0 0 1px var(--line2);padding:22px}
.sheet .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.f{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.f label{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mfoot{display:flex;gap:10px;justify-content:space-between;margin-top:8px;flex-wrap:wrap}
.pick{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;font-size:14px}

async function api(action,table,data,id){
  const r=await fetch(CFG.url+'/rest/v1/rpc/os_api',{method:'POST',headers:{apikey:CFG.key,'Content-Type':'application/json'},
    body:JSON.stringify({p_token:K(),p_action:action,p_table:table||null,p_data:data||{},p_id:id||null})});
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));
  return j}

const dbKey=k=>S.dbs.find(d=>d.key===k);
const page=id=>S.pages.find(p=>p.id===id);
const live=p=>p&&!p.archived&&!p.is_template;
const pagesOf=dbid=>S.pages.filter(p=>p.database_id===dbid&&live(p));
const tplOf=dbid=>S.pages.filter(p=>p.database_id===dbid&&p.is_template&&!p.archived);
const viewsOf=dbid=>S.views.filter(v=>v.database_id===dbid).sort((a,b)=>a.sort-b.sort);
const P=(p,k)=>p&&p.props?p.props[k]:undefined;

const propDef=(d,pid)=>(d&&d.schema||[]).find(x=>x.id===pid);
const optOf=(d,pid,v)=>((propDef(d,pid)||{}).options||[]).find(o=>o.id===v);

const DB={
  async load(){
    if(DEMO)return false;
    const [me,dbs,pages,views,act]=await Promise.all([api('whoami'),api('list','os_databases'),api('list','os_pages'),api('list','os_views'),api('list','os_activity')]);
    const sig=JSON.stringify([dbs,pages,views,(act||[]).slice(0,5)]);
    const changed=sig!==S._sig;
    // несохранённые локальные правки не затираем свежей выгрузкой
    const merge=(c,srv)=>{srv=srv||[];const out=srv.map(x=>S.dirty[x.id]?(S[c].find(y=>y.id===x.id)||x):x);
      S[c].forEach(y=>{if(S.dirty[y.id]&&!srv.some(x=>x.id===y.id))out.push(y)});return out};
    Object.assign(S,{me,dbs:merge('dbs',dbs),pages:merge('pages',pages),views:merge('views',views),activity:act||[],live:true,synced:Date.now(),_sig:sig});
    return changed},
  mark(id){const t=Date.now();S.dirty[id]=t;return()=>{if(S.dirty[id]===t)delete S.dirty[id]}},
  async ins(table,row){
    const c=COLL[table];row={id:uid(),...row};const now=new Date().toISOString();
    const local={created_at:now,updated_at:now,sort:Date.now(),...(table==='os_pages'?{props:{},blocks:[],archived:false,is_template:false,favorite:false,created_by:(S.me&&S.me.display)||'Виктория'}:{}),...row};
    S[c].push(local);const done=DB.mark(row.id);
    if(!DEMO){try{const r=await api('insert',table,row);if(r)Object.assign(local,r);done()}catch(e){done();S[c]=S[c].filter(x=>x.id!==row.id);UI.toast('Не сохранилось: '+e.message);sched();throw e}}
    else if(table==='os_pages'&&!row.is_template)logDemo('insert',local);
    sched();return local},
  async upd(table,id,patch){
    const c=COLL[table];const x=S[c].find(y=>y.id===id);if(!x)return;
    const before=clone(x);Object.assign(x,patch,{updated_at:new Date().toISOString()});
    const T=dbKey('tasks');
    if(table==='os_pages'&&T&&x.database_id===T.id&&patch.props){if(patch.props.status==='done'&&before.props.status!=='done')x.props.done_at=new Date().toISOString();if(patch.props.status!=='done')delete x.props.done_at}
    const done=DB.mark(id);
    if(!DEMO){try{await api('update',table,patch,id);done()}catch(e){done();Object.assign(x,before);UI.toast('Не сохранилось: '+e.message);sched()}}
    else if(table==='os_pages'&&(patch.props||patch.title!==undefined||patch.archived))logDemo(patch.props&&patch.props.status==='done'&&before.props.status!=='done'?'done':patch.archived?'archive':'update',x);
    sched()},
  async del(table,id){
    const c=COLL[table];const keep=S[c];S[c]=S[c].filter(y=>y.id!==id);sched();
    if(!DEMO){try{await api('delete',table,null,id)}catch(e){S[c]=keep;UI.toast('Не удалилось: '+e.message);sched()}}},
  setProp(p,k,v){const props={...p.props};if(v===null||v===undefined||v===''||(Array.isArray(v)&&!v.length))delete props[k];else props[k]=v;return DB.upd('os_pages',p.id,{props})}
};
function logDemo(action,p){S.activity.unshift({id:Date.now(),at:new Date().toISOString(),actor:'Виктория',action,entity:(db(p.database_id)||{}).key||'page',entity_id:p.id,title:p.title})}

let rT=null,pending=false;
const editing=()=>{const a=document.activeElement;return!!(a&&(a.isContentEditable||(/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.closest('#root'))))};
function sched(){if(editing()){pending=true;return}cancelAnimationFrame(rT);rT=requestAnimationFrame(render)}
document.addEventListener('focusout',()=>setTimeout(()=>{if(pending&&!editing()){pending=false;render()}},250));

}

/* ── значения свойств ── */
function optChip(o){return o?`<span class="opt"><i style="background:${o.color||'#9B6FE8'}"></i>${esc(o.name)}</span>`:''}
function whoEl(k){const w=PEOPLE[k];if(!w)return'';return`<span class="who ${k}" title="${w[1]}">${w[0]}</span>`}
function dueTag(v,plain){if(!v)return'';if(plain)return`<span class="tag">${fmtD(v)}</span>`;const d=daysTo(v);
  if(d<0)return`<span class="tag hot">просрочено · ${fmtD(v)}</span>`;if(d===0)return`<span class="tag soon">сегодня</span>`;if(d===1)return`<span class="tag soon">завтра</span>`;
  return`<span class="tag ${d<=3?'soon':''}">${fmtD(v)}</span>`}
const CLOSED=['done','finished','lost','dropped','paid','refund'];
function isDone(p){const d=db(p.database_id);if(!d)return false;const st=(d.schema||[]).find(x=>x.type==='status');if(!st)return false;const v=P(p,st.id);return d.key==='clients'?['finished','lost'].includes(v):CLOSED.includes(v)}
function val(d,p,pid,mode){
  const def=propDef(d,pid);if(!def)return'';const v=P(p,pid);
  if(v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length))return'';
  switch(def.type){
    case'select':case'status':return optChip(optOf(d,pid,v));
    case'multi_select':return(v||[]).map(x=>optChip(optOf(d,pid,x))).join('');
    case'date':return dueTag(v,isDone(p)||d.key==='payments');
    case'checkbox':return v?`<span class="opt">${ico('check',13)} ${esc(def.name)}</span>`:'';
    case'person':return whoEl(v)+(mode==='full'?`<span style="font-size:14px">${PEOPLE[v]?PEOPLE[v][1]:esc(v)}</span>`:'');
    case'relation':return(v||[]).map(id=>{const r=page(id);if(!r)return'';const rd=db(r.database_id);const dot=rd&&rd.key==='areas'?`<i class="dot" style="background:${areaColor(id)};width:7px;height:7px"></i>`:pIco(r,13);

const SHORT=[[/^# /,'h1'],[/^## /,'h2'],[/^### /,'h3'],[/^[-*•] /,'bullet'],[/^1[.)] /,'number'],[/^\[\] /,'todo'],[/^> /,'quote'],[/^---$/,'divider'],[/^``` ?/,'code']];
const ED={
  pid:null,t:null,menu:null,
  get p(){return page(this.pid)},
  mount(){const el=$('editor');if(!el)return;this.pid=el.dataset.id;const p=this.p;if(!p.blocks||!p.blocks.length)p.blocks=[{id:uid(),type:'p',text:''}];this.draw();
    const t=$('pg-title');if(!t)return;
    t.addEventListener('input',()=>{clearTimeout(this.tt);const id=p.id;S.dirty[id]=Date.now();this.tt=setTimeout(()=>DB.upd('os_pages',id,{title:t.innerText.trim()}),600)});
    t.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();this.focus(p.blocks[0].id,0)}});
    if(!p.title&&UI.fresh===p.id)setTimeout(()=>t.focus(),30);UI.fresh=null},
  draw(){const el=$('editor');if(!el)return;const bs=this.p.blocks;let n=0;
    el.innerHTML=bs.map(b=>{n=b.type==='number'?n+1:0;return this.html(b,n)}).join('');
    el.querySelectorAll('.ce').forEach(c=>this.bind(c))},
  html(b,n){const ph=b.type==='p'?'Пиши или нажми «/» для блоков':b.type.startsWith('h')?'Заголовок':b.type==='todo'?'Задача':b.type==='bullet'||b.type==='number'?'Пункт':'';
    const ce=`<div class="ce" contenteditable="plaintext-only" spellcheck="true" data-ph="${ph}" data-b="${b.id}">${esc(b.text||'')}</div>`;
    const h=`<button class="hdl" onclick="ED.blockMenu(event,'${b.id}')" title="Действия">⋮⋮</button>`;
    if(b.type==='divider')return`<div class="blk divider">${h}<hr></div>`;
    if(b.type==='page'){const c=page(b.page);return`<div class="blk page">${h}<div class="pl" onclick="go('#/p/${b.page}')">${(c&&pIco(c,17))||ico('file',17)} ${esc(c?titleOf(c):'Страница удалена')}</div></div>`}
    if(b.type==='todo')return`<div class="blk todo ${b.checked?'done':''}">${h}<span class="mk"><button class="check ${b.checked?'on':''}" style="width:20px;height:20px;border-radius:6px" onclick="ED.tick('${b.id}')">${OK}</button></span>${ce}</div>`;
    if(b.type==='bullet')return`<div class="blk bullet">${h}<span class="mk"></span>${ce}</div>`;
    if(b.type==='number')return`<div class="blk number">${h}<span class="mk">${n}.</span>${ce}</div>`;
    if(b.type==='callout')return`<div class="blk callout">${h}<span class="mk">${ico('bulb',17)}</span>${ce}</div>`;
    return`<div class="blk ${b.type}">${h}${ce}</div>`},
  idx(id){return this.p.blocks.findIndex(b=>b.id===id)},
  save(){clearTimeout(this.t);const p=this.p;S.dirty[p.id]=Date.now();this.t=setTimeout(()=>DB.upd('os_pages',p.id,{blocks:p.blocks}),700)},
  focus(id,off){const c=document.querySelector(`.ce[data-b="${id}"]`);if(!c)return;c.focus();const r=document.createRange(),s=getSelection();
    const tn=c.firstChild;if(!tn)r.setStart(c,0);else r.setStart(tn,off===-1?tn.length:Math.min(off,tn.length));r.collapse(true);s.removeAllRanges();s.addRange(r)},
  caret(c){const s=getSelection();if(!s.rangeCount)return 0;const g=s.getRangeAt(0);const r=g.cloneRange();r.selectNodeContents(c);r.setEnd(g.endContainer,g.endOffset);return r.toString().length},
  bind(c){
    c.addEventListener('input',()=>{const b=this.p.blocks[this.idx(c.dataset.b)];if(!b)return;b.text=c.innerText.replace(/\u00a0/g,' ').replace(/\n$/,'');
      const m=SHORT.find(([re])=>re.test(b.text));
      if(m&&b.type==='p'){b.text=b.text.slice(b.text.match(m[0])[0].length);this.setType(b.id,m[1]);return}
      if(b.text.startsWith('/'))this.slashOpen(c,b.text.slice(1));else if(this.menu)this.slashClose();

    c.addEventListener('keydown',e=>this.key(e,c));
    c.addEventListener('paste',e=>{const t=(e.clipboardData||window.clipboardData).getData('text');if(!t||!t.includes('\n'))return;e.preventDefault();
      const lines=t.split(/\r?\n/);const i=this.idx(c.dataset.b),b=this.p.blocks[i],off=this.caret(c);const tail=b.text.slice(off);b.text=b.text.slice(0,off)+lines[0];
      const add=lines.slice(1).map(l=>({id:uid(),type:'p',text:l}));const last=add[add.length-1];const at=last.text.length;last.text+=tail;this.p.blocks.splice(i+1,0,...add);this.draw();this.focus(last.id,at);this.save()})},
  key(e,c){
    const i=this.idx(c.dataset.b),bs=this.p.blocks,b=bs[i];if(!b)return;
    if(this.menu){if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();this.menu.sel=(this.menu.sel+(e.key==='ArrowDown'?1:-1)+this.menu.items.length)%this.menu.items.length;this.slashDraw();return}
      if(e.key==='Enter'){e.preventDefault();const it=this.menu.items[this.menu.sel];if(it)this.slashPick(it[0]);return}if(e.key==='Escape'){e.preventDefault();this.slashClose();return}}

  },
  prevText(i){for(let j=i-1;j>=0;j--)if(!['divider','page'].includes(this.p.blocks[j].type))return j;return-1},
  nextText(i){for(let j=i+1;j<this.p.blocks.length;j++)if(!['divider','page'].includes(this.p.blocks[j].type))return j;return-1},
  setType(id,type){const i=this.idx(id),b=this.p.blocks[i];
    if(type==='page'){const pid=this.pid;UI.newPage(pid,true).then(np=>{const pp=page(pid);const bb=pp.blocks.find(x=>x.id===id);if(bb){bb.type='page';bb.page=np.id;bb.text=''}DB.upd('os_pages',pid,{blocks:pp.blocks});UI.fresh=np.id;go('#/p/'+np.id)});return}

    this.draw();this.focus(id,(b.text||'').length);this.save()},
  tick(id){const b=this.p.blocks[this.idx(id)];b.checked=!b.checked;this.draw();this.save()},
  slashOpen(c,q){const items=BLOCKS.filter(([k,n,,,al])=>!q||(n+' '+al).toLowerCase().includes(q.toLowerCase()));

  slashDraw(){let m=$('slash');if(!m){m=document.createElement('div');m.id='slash';m.className='slash';document.body.appendChild(m)}
    const r=this.menu.c.getBoundingClientRect();m.style.left=Math.max(8,Math.min(r.left,window.innerWidth-292))+window.scrollX+'px';
    const below=r.bottom+350<window.innerHeight;m.style.top=(below?r.bottom+6:Math.max(8,r.top-346))+window.scrollY+'px';
    m.innerHTML=this.menu.items.map((it,j)=>`<button class="${j===this.menu.sel?'on':''}" onmousedown="event.preventDefault();ED.slashPick('${it[0]}')"><span class="si">${it[3]}</span><span>${it[1]}<small>${it[2]}</small></span></button>`).join('');
    const on=m.querySelector('.on');if(on)on.scrollIntoView({block:'nearest'})},
  slashClose(){this.menu=null;const m=$('slash');if(m)m.remove()},
  slashPick(type){const c=this.menu.c;const b=this.p.blocks[this.idx(c.dataset.b)];if(b.text.startsWith('/'))b.text=b.text.replace(/^\/\S*\s?/,'');this.slashClose();this.setType(b.id,type)},
  blockMenu(e,id){e.stopPropagation();const b=this.p.blocks[this.idx(id)];
